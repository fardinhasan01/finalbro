kind = "web"
previewPath = "/"
title = "BanglaRun - Educational Endless Runner"
version = "1.0.0"
id = "artifacts/banglarun"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24821

[services.development]
run = "pnpm --filter @workspace/banglarun run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/banglarun", "run", "build" ]
publicDir = "artifacts/banglarun/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24821"
BASE_PATH = "/"
